<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ХэндМейд Стиль · Дашборд заказов</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <div class="page">
      <div class="page-header__row">
        <h1 class="page-title">ХэндМейд Стиль</h1>
        <p class="page-subtitle" id="period-label">Загрузка данных…</p>
      </div>
      <div class="filter-bar">
        <label class="filter-bar__field">
          <span class="filter-bar__caption">С</span>
          <input type="date" id="filter-from">
        </label>
        <label class="filter-bar__field">
          <span class="filter-bar__caption">По</span>
          <input type="date" id="filter-to">
        </label>
        <button type="button" class="filter-bar__reset" id="filter-reset">Сбросить</button>
        <label class="upload-btn">
          Загрузить CSV
          <input type="file" id="csv-file" accept=".csv,.txt" hidden>
        </label>
        <span class="upload-status" id="upload-status"></span>
        <span class="filter-bar__hint">Даты «С» и «По» можно указывать в любом порядке — отбор посчитается правильно</span>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="banner banner--error" id="error-banner" hidden></div>
    <div class="banner banner--warning" id="mismatch-banner" hidden></div>

    <section class="cards" aria-label="Ключевые показатели">
      <article class="card">
        <p class="card__label">Выручка</p>
        <p class="card__value" id="revenue-value">—</p>
      </article>
      <article class="card">
        <p class="card__label">Заказов</p>
        <p class="card__value" id="orders-value">—</p>
      </article>
      <article class="card">
        <p class="card__label">Средний чек</p>
        <p class="card__value" id="avg-value">—</p>
      </article>
    </section>

    <section class="panels">
      <div class="panel">
        <h2 class="panel__title">Топ-5 товаров по выручке</h2>
        <div class="panel__body" id="top-products"></div>
      </div>
      <div class="panel">
        <h2 class="panel__title">Продажи по категориям</h2>
        <div class="panel__body" id="categories"></div>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel__title">Продажи по дням</h2>
      <div class="panel__body" id="by-day"></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
